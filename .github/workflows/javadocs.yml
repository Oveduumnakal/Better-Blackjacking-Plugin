name: JavaDocs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  javadocs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 11

      - uses: gradle/actions/setup-gradle@v6

      - name: Verify JavaDocs.md is fresh and complete
        run: ./gradlew -p javadoc-tools checkJavaDocs --no-daemon
