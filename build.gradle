plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'
def pluginMainClass = 'com.oveduumnakal.betterblackjacking.BetterBlackjackingPluginTest'

dependencies {
	compileOnly group: 'net.runelite', name:'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	testImplementation 'junit:junit:4.12'
	testImplementation group: 'net.runelite', name:'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name:'jshell', version: runeLiteVersion
	testImplementation 'org.mockito:mockito-core:5.12.0'
	testImplementation 'com.google.inject.extensions:guice-testlib:4.1.0'
}

group = 'com.oveduumnakal'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
	options.compilerArgs << '-Xlint:deprecation'
}

def pythonExecutable = org.gradle.internal.os.OperatingSystem.current().isWindows()
		? 'python'
		: 'python3'

tasks.register('checkStyleRules', Exec) {
	group = 'verification'
	description = 'Checks the project coding standards (scripts/check-style.py).'
	commandLine pythonExecutable, 'scripts/check-style.py'
}

check.dependsOn checkStyleRules

javadoc {
	options.memberLevel = JavadocMemberLevel.PRIVATE
	options.addStringOption('Xdoclint:syntax,html,reference', '-quiet')
}

check.dependsOn javadoc

/*
 * The JavaDocs.md generator and freshness gate live in the standalone ./javadoc-tools build so
 * their javaparser dependency stays out of this build (the RuneLite plugin-hub compiles it under
 * dependency verification, which forbids unlisted deps). Run the gate with:
 *   ./gradlew -p javadoc-tools checkJavaDocs
 * and regenerate with:
 *   ./gradlew -p javadoc-tools generateJavaDocs
 * CI enforces it in the JavaDocs workflow.
 */

tasks.register('run', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = pluginMainClass

	jvmArgs "-ea"
	args "--developer-mode", "--debug"
}

tasks.register('shadowJar', Jar) {
	dependsOn configurations.testRuntimeClasspath
	manifest {
		attributes('Main-Class': pluginMainClass, 'Multi-Release': true)
	}

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from sourceSets.main.output
	from sourceSets.test.output
	from {
		configurations.testRuntimeClasspath.collect { file ->
			file.isDirectory() ? file : zipTree(file)
		}
	}

	exclude 'META-INF/INDEX.LIST'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
	exclude '**/module-info.class'

	group = BasePlugin.BUILD_GROUP
	archiveClassifier.set('shadow')
	archiveFileName.set("${rootProject.name}-${project.version}-all.jar")
}
