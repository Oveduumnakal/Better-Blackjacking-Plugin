<?xml version="1.0" encoding="UTF-8"?>
<!--
  Better Blackjacking logo: two fanned playing cards, "BB" on the front card and a blackjack
  (short wooden club with a darker grip) laid across both.

  Design source for icon.png. Regenerate with `python scripts/gen-icon.py`. The script renders
  this file itself, so keep to the subset it understands: <g> (fill/stroke inheritance and a
  single rotate(a cx cy) transform), <rect> (x y width height rx), <circle> and <polygon>, with
  fill, stroke and stroke-width as attributes (no CSS, no paths, no filters).

  Palette (5 colours): outline #2A1B12, card #F6F0DE, suit red #C62830, wood #C98A4A, grip #5E3519.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <g id="back-card" transform="rotate(-15 16 21)">
    <rect x="5" y="6" width="22" height="30" rx="3" fill="#F6F0DE" stroke="#2A1B12" stroke-width="2"/>
  </g>

  <g id="front-card" transform="rotate(10 30 20)">
    <rect x="19" y="5" width="22" height="30" rx="3" fill="#F6F0DE" stroke="#2A1B12" stroke-width="2"/>
    <g id="letters" fill="#C62830">
      <rect x="21" y="8" width="3" height="13"/>
      <rect x="21" y="8" width="8" height="7" rx="2.5"/>
      <rect x="21" y="14" width="8.5" height="7" rx="2.5"/>
      <rect x="30.5" y="8" width="3" height="13"/>
      <rect x="30.5" y="8" width="8" height="7" rx="2.5"/>
      <rect x="30.5" y="14" width="8.5" height="7" rx="2.5"/>
      <g fill="#F6F0DE">
        <rect x="24" y="10.5" width="2.5" height="2"/>
        <rect x="24" y="16.5" width="3" height="2"/>
        <rect x="33.5" y="10.5" width="2.5" height="2"/>
        <rect x="33.5" y="16.5" width="3" height="2"/>
      </g>
    </g>
  </g>

  <g id="blackjack" transform="rotate(-20 24 35)">
    <g id="blackjack-outline" fill="#2A1B12" stroke="#2A1B12" stroke-width="4">
      <circle cx="5" cy="35" r="3"/>
      <rect x="5" y="32.5" width="13" height="5" rx="2.5"/>
      <polygon points="17,32 39,29.5 39,40.5 17,38"/>
      <circle cx="39" cy="35" r="5.5"/>
    </g>
    <g id="blackjack-fill">
      <polygon points="17,32 39,29.5 39,40.5 17,38" fill="#C98A4A"/>
      <circle cx="39" cy="35" r="5.5" fill="#C98A4A"/>
      <rect x="5" y="32.5" width="13" height="5" rx="2.5" fill="#5E3519"/>
      <circle cx="5" cy="35" r="3" fill="#5E3519"/>
    </g>
  </g>
</svg>
